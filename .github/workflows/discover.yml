name: Discover papers and revisions
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: literature-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing data and collector
        run: python -m unittest discover -s tests -v
      - name: Find candidates and existing-paper revisions
        run: python scripts/discover.py --days 14
      - name: Save candidate metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates.json data/discovery_status.json docs/inbox.md
          if ! git diff --cached --quiet; then
            git commit -m 'research: refresh arXiv candidates and revisions'
            git push origin HEAD
          fi
